name: lhx-cb

# Static-only site: the J1900 only serves pre-baked static files (gzip).
# All 3D rendering, physics, terrain/OSM meshing and audio run client-side in Chrome.
# Shares the exact pinned nginx-unprivileged image already cached on clanAI (0 MB extra).
# Expected J1900 footprint: ~3-5 MB RAM, ~0% idle CPU.
services:
  lhx:
    image: nginxinc/nginx-unprivileged@sha256:f5116ed4606f3eb015dd4a8e28cb9b351476dc0ad4bc6e9f93b19cec130cdf03
    container_name: lhx_cb
    user: "1000:1000"
    restart: unless-stopped
    ports:
      - "8030:8080"
    volumes:
      # Served straight from the git working copy (no build step). Edit -> reload Chrome.
      - /home/t0nz/AiProjects/LHX_cb/web:/usr/share/nginx/html:ro
      - /home/t0nz/AiProjects/LHX_cb/deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    read_only: true
    tmpfs:
      - /tmp:uid=1000,gid=1000,mode=1777
      - /var/cache/nginx:uid=1000,gid=1000,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 64m
    cpus: 0.50
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 60s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "2m"
        max-file: "2"
