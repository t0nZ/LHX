server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;
    access_log off;

    # Only read-only methods allowed
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    # Gzip static assets: height.bin (~526 KB) and osm.json (~1.1 MB) shrink ~4x
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript text/javascript application/json application/octet-stream image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive, noimageindex" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'none'" always;

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
    }
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public" always;
    }
    location /vendor/ {
        expires 30d;
        add_header Cache-Control "public, immutable" always;
    }
}
